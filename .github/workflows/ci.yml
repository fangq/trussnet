# SPDX-License-Identifier: GPL-3.0-or-later
# Continuous integration for v2mesh: the standalone binary with its CLI tests
# (Linux / macOS / Windows, uploaded as artifacts), a CPU-only build, the Python
# module, the Octave and MATLAB MEX with their unit tests, and the formatting gate;
# the Linux binary is the manylinux2014 (glibc 2.17) one, and pushes by fangq
# upload the binaries to the nightly folder.
#
# GitHub-hosted runners have no GPU (and no OpenCL library unless one is installed;
# the first job has none, the others the ICD loader without a driver):
# `--gpu` / gpu=True fall back to the CPU there, and the tests that need a device
# skip themselves, so every job runs the full test suites on the CPU path.
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: binary + CLI tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          # the headers only, no OpenCL library: the GPU build must still run (CPU)
          sudo apt-get install -y --no-install-recommends cmake g++ make opencl-headers
      - name: Build + CLI tests (make check)
        run: make check CMAKE_ARGS="-DV2M_STATIC_LINK=ON"
      - name: "Runtime dependencies (no libOpenCL: loaded at run time)"
        run: |
          ldd build/v2mesh
          ! ldd build/v2mesh | grep -q libOpenCL
          build/v2mesh --shape sphere --dim 24 --gpu 2>&1 | grep 'running on the CPU'

  linux-portable:
    # the released Linux binary: built in manylinux2014 (glibc 2.17), so it starts
    # on any distribution since Ubuntu 14.04 / CentOS 7 (built on the runner it
    # needed GLIBC_2.35); the CLI tests run on it there
    name: portable binary (manylinux2014) + CLI tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build + CLI tests in manylinux2014
        run: |
          docker run --rm -v "$PWD:/src" -w /src quay.io/pypa/manylinux2014_x86_64 \
              bash .github/linux_release_builder/build_v2mesh.sh
      - name: Runtime dependencies
        run: ldd build-manylinux/v2mesh
      - uses: actions/upload-artifact@v4
        with:
          name: v2mesh-linux-x86_64
          path: |
            build-manylinux/v2mesh
            LICENSE
            CREDITS.md
            LICENSES/

  linux-gui:
    # the v2m GUI (Lazarus 2.2.0, gtk2), built in manylinux2014 (glibc 2.17) like
    # the binary above, so it starts on Ubuntu 18.04 and older too
    name: v2m GUI (manylinux2014)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the builder image (FPC 3.2.2 + Lazarus 2.2.0)
        run: docker build -t v2m-linux-release-builder .github/linux_release_builder
      - name: Build v2m in manylinux2014
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src" \
              v2m-linux-release-builder bash .github/linux_release_builder/build_v2m.sh
      - name: Runtime dependencies
        run: ldd v2m/bin/v2m
      - uses: actions/upload-artifact@v4
        with:
          name: v2m-linux-x86_64
          path: |
            v2m/bin/v2m
            LICENSE
            CREDITS.md
            LICENSES/

  linux-cpu:
    name: CPU-only build (no OpenCL) + CLI tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake g++ make
      - name: Build + CLI tests
        run: make check CMAKE_ARGS="-DV2M_USE_OPENCL=OFF"

  macos:
    name: binary + CLI tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install libomp
      - name: Build + CLI tests (make check)
        # Apple clang + Homebrew's libomp (linked statically when its archive
        # exists, so the binary does not need libomp installed)
        run: |
          OMP=$(brew --prefix libomp)
          ARGS="-DOpenMP_ROOT=$OMP -DV2M_STATIC_LINK=ON"
          if [ -f "$OMP/lib/libomp.a" ]; then ARGS="$ARGS -DOpenMP_omp_LIBRARY=$OMP/lib/libomp.a"; fi
          make check CMAKE_ARGS="$ARGS"
      - name: Runtime dependencies
        run: otool -L build/v2mesh
      - uses: actions/upload-artifact@v4
        with:
          name: v2mesh-${{ matrix.os }}
          path: |
            build/v2mesh
            LICENSE
            CREDITS.md
            LICENSES/

  windows:
    name: binary + CLI tests (Windows, mingw-w64 static)
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-opencl-icd
            mingw-w64-ucrt-x86_64-opencl-headers
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DV2M_BUILD_TESTS=ON -DV2M_STATIC_LINK=ON
      - name: Build
        run: cmake --build build --parallel
      - name: CLI tests
        run: ctest --test-dir build --output-on-failure
      - name: Runtime dependencies (DLL imports)
        continue-on-error: true
        run: objdump -p build/v2mesh.exe | grep -i "DLL Name"
      - uses: actions/upload-artifact@v4
        with:
          name: v2mesh-windows-x64
          path: |
            build/v2mesh.exe
            LICENSE
            CREDITS.md
            LICENSES/

  python:
    name: python module + unit tests (${{ matrix.python }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ make ocl-icd-opencl-dev opencl-headers
          python -m pip install --upgrade pip numpy pybind11 "jdata>=0.9.5"
      - name: Build the module (in-tree)
        run: |
          cmake -S . -B build-py -DCMAKE_BUILD_TYPE=Release -DV2M_BUILD_PYTHON=ON -DPython_EXECUTABLE="$(which python)"
          cmake --build build-py --target _v2mesh --parallel
      - name: Unit tests
        run: python -m unittest discover -v -s pyv2mesh/tests

  octave:
    name: Octave MEX + unit tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ make ocl-icd-opencl-dev opencl-headers \
            octave liboctave-dev
      - name: Build the Octave MEX
        run: |
          cmake -S . -B build-oct -DCMAKE_BUILD_TYPE=Release -DV2M_BUILD_OCTAVE_MEX=ON
          cmake --build build-oct --target v2m_octave_mex --parallel
      - name: Unit tests
        run: octave-cli --no-gui --norc --eval "addpath('matlab/tests'); exit(run_v2mesh_tests() > 0)"
      - uses: actions/upload-artifact@v4
        with:
          name: v2mesh-octave-mex-linux
          path: |
            matlab/v2mesh_mex.mex
            LICENSE
            CREDITS.md
            LICENSES/

  matlab:
    name: MATLAB MEX + unit tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ make ocl-icd-opencl-dev opencl-headers
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2023b
      - name: Build the MATLAB MEX
        run: |
          MROOT=$(dirname "$(dirname "$(readlink -f "$(which matlab)")")")
          echo "MATLAB root: $MROOT"
          cmake -S . -B build-mex -DCMAKE_BUILD_TYPE=Release -DV2M_BUILD_MATLAB_MEX=ON -DMatlab_ROOT_DIR="$MROOT"
          cmake --build build-mex --target v2m_matlab_mex --parallel
          ldd matlab/v2mesh_mex.mexa64
      - name: Unit tests
        uses: matlab-actions/run-command@v2
        with:
          command: addpath('matlab/tests'); assert(run_v2mesh_tests() == 0, 'v2mesh MEX tests failed');
      - uses: actions/upload-artifact@v4
        with:
          name: v2mesh-matlab-mex-linux
          path: |
            matlab/v2mesh_mex.mexa64
            LICENSE
            CREDITS.md
            LICENSES/

  nightly:
    # each binary zipped, as v2mesh-<platform>-github-latest.zip, to the nightly
    # folder of mcx.space (the MCX_* secrets mcx / mmc / mcxcl upload with)
    name: upload the binaries (nightly)
    needs: [linux-portable, linux-gui, macos, windows]
    runs-on: ubuntu-22.04
    if: ${{ !cancelled() && needs.linux-portable.result == 'success' && github.repository_owner == 'fangq' && github.actor == 'fangq' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: v2m*
          path: artifacts
      - name: Zip each platform
        run: |
          mkdir packages
          # the binaries only (the MEX artifacts are their jobs', not waited for);
          # the Linux ones sit under their build folder in the artifact
          linux=artifacts/v2mesh-linux-x86_64/build-manylinux/v2mesh
          gui=artifacts/v2m-linux-x86_64/v2m/bin/v2m
          # the GUI, with the Linux v2mesh it runs beside when that was built
          if [ -f "$gui" ]; then
            mkdir pkg && cp -a artifacts/v2m-linux-x86_64/. pkg/ && rm -rf pkg/v2m
            cp "$gui" pkg/
            [ -f "$linux" ] && cp "$linux" pkg/
            chmod +x pkg/v2m*
            mv pkg v2m && zip -FSr --symlink packages/v2m-linux-x86_64-github-latest.zip v2m && rm -rf v2m
          fi
          for name in linux-x86_64 macos-14 macos-15-intel windows-x64; do
            d=artifacts/v2mesh-$name
            [ -d "$d" ] || continue
            zipname=v2mesh-$name
            zipname=${zipname/macos-15-intel/macos-x86_64}
            zipname=${zipname/macos-14/macos-arm64}
            mkdir pkg && cp -a "$d"/. pkg/
            if [ -d pkg/build-manylinux ]; then mv pkg/build-manylinux/v2mesh pkg/ && rm -rf pkg/build-manylinux; fi
            if [ -d pkg/build ]; then mv pkg/build/v2mesh* pkg/ && rm -rf pkg/build; fi
            chmod +x pkg/v2mesh* || true
            mv pkg v2mesh && zip -FSr --symlink "packages/$zipname-github-latest.zip" v2mesh && rm -rf v2mesh
          done
          ls -l packages
      - name: Copy the packages to the server
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.MCX_SERVER }}
          username: ${{ secrets.MCX_SERVER_USER }}
          ssh_private_key: ${{ secrets.MCX_SERVER_SSH_KEY }}
          local_path: "packages/*"
          remote_path: ${{ secrets.MCX_CI_PATH }}

  format:
    name: format (astyle / black / mh_style)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the formatters
        # astyle 3.1 (Ubuntu 22.04) is the version `make pretty` is written for
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends astyle
          python -m pip install black==23.12.1 miss_hit==0.9.44
      - name: make pretty must be a no-op
        run: |
          make pretty
          if ! git diff --exit-code; then
            echo "::error::Code is not formatted. Run 'make pretty' and commit the result."
            exit 1
          fi
